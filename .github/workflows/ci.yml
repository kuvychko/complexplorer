name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install ruff
        run: |
          uv venv
          uv pip install "ruff>=0.6"
      - name: ruff check
        run: uv run --no-sync ruff check complexplorer/ tests/
      - name: ruff format --check
        run: uv run --no-sync ruff format --check complexplorer/ tests/

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # vtk wheels for new Python releases often lag; do not let 3.13 block the matrix until
    # those wheels are confirmed available.
    continue-on-error: ${{ matrix.python == '3.13' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Create venv
        run: uv venv

      # Install from pyproject ranges (not uv.lock) so CI catches upstream breakage. PyVista
      # is a core dependency as of 3.0, so there is no longer a no-PyVista lane.
      - name: Install
        run: uv pip install -e ".[dev]"

      # xvfb for real offscreen rendering on Linux; Windows renders offscreen natively.
      - name: Headless display (Linux)
        if: runner.os == 'Linux'
        uses: pyvista/setup-headless-display-action@v3

      - name: Run tests
        run: uv run --no-sync pytest tests/ -q
