name: Deploy Documentation

# Recovered from v2.0.0 by the reconcile-with-2-0-release change, with the push trigger REMOVED:
# the live site at kuvychko.github.io/complexplorer still documents 2.0, and merging this line
# must not overwrite it. `publish-rev3-docs-site` owns the rev3 content and switches this to a
# release-tag trigger.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install mkdocs-material mkdocs-jupyter pymdown-extensions

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
