# The complexplorer documentation site. Built with `mkdocs build --strict`, which is a release
# gate: a nav entry pointing at a missing page, or a broken internal link, fails the build.
# Assets under examples/ are added to the build by docs/hooks/site_assets.py -- they are not
# copied into docs/.
site_name: Complexplorer
site_description: Beautiful visualizations of complex functions
site_url: https://kuvychko.github.io/complexplorer/
repo_url: https://github.com/kuvychko/complexplorer
repo_name: kuvychko/complexplorer

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
  # The API reference is generated from docstrings, so it cannot drift from the code.
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            # Constructor arguments belong under the class, not as a separate __init__ entry
            # that doubles the length of every page's table of contents.
            merge_init_into_class: true
            filters: ["!^_"]
            show_root_heading: true
            heading_level: 3
            members_order: source
            separate_signature: true
            show_signature_annotations: true

hooks:
  - docs/hooks/site_assets.py
  - docs/hooks/version_banner.py

# A broken internal link or a missing nav page fails the build rather than reaching a reader.
strict: true

# Working notes stay in the repository for whoever maintains that code, but are not documentation.
exclude_docs: |
  old/
  internal/
  hooks/
  overrides/
  gallery/README.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      title: On this page
  - attr_list
  - md_in_html

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started:
      - Installation and a first portrait: getting-started/first-portrait.md
  - Guide:
      - Reading a phase portrait: guide/reading-a-portrait.md
      - Domains: guide/domains-and-colormaps.md
      - 3D and the Riemann sphere: guide/three-dimensions.md
      - Riemann surfaces: guide/riemann-surfaces.md
      - Engineering mode: guide/engineering-mode.md
      - Catalog and presets: guide/presets-and-catalog.md
      - Catalog reference: function-presets.md
      - Command line: guide/cli.md
      - STL and physical output: guide/physical-workflow.md
  - Gallery: gallery/gallery.generated.md
  - API reference:
      - Overview: api/index.md
      - Domains: api/domains.md
      - Colormaps: api/colormaps.md
      - Plotting (2D): api/plotting-2d.md
      - Plotting (3D): api/plotting-3d.md
      - Modulus scaling: api/scaling.md
      - Catalog and presets: api/catalog.md
      - STL export: api/export.md
      - Engineering mode: api/engineering.md
      - Core and exceptions: api/core.md
  - Migrating to 3.0: migration-3.0.md
  - Development:
      - Contributing: development/contributing.md
      - Backend policy: development/backend-policy.md
      - Surface kernel: development/surface-kernel.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kuvychko/complexplorer
