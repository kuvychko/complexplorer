[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["complexplorer", "complexplorer.*"]
exclude = ["examples*", "tests*", "docs*", "build*", "*.egg-info"]

[tool.setuptools.dynamic]
version = {attr = "complexplorer._version.__version__"}

[project]
name = "complexplorer"
dynamic = ["version"]
authors = [
  { name="Igor Kuvychko", email="igor.kuvychko@gmail.com" },
]
description = "Complex function visualizations inspired by Elias Wegert's 'Visual Complex Functions - An Introduction with Phase Portraits'"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
    "asteval>=1.0",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics",
    "Operating System :: OS Independent",
    "Framework :: Matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-timeout>=2.1.0",
    "ruff>=0.6",
]
pyvista = [
    "pyvista>=0.47",
]
# Alias for the PyVista 3D backend. New 3D features are PyVista-only; PyVista becomes a
# required dependency at 3.0 (see docs/development/backend-policy.md).
"3d" = [
    "complexplorer[pyvista]",
]
qt = [
    "PyQt6>=6.5.0",
]
all = [
    "complexplorer[dev,pyvista,qt]",
]

[project.scripts]
complexplorer = "complexplorer.cli.main:main"

[project.urls]
"Homepage" = "https://github.com/kuvychko/complexplorer"
"Bug Tracker" = "https://github.com/kuvychko/complexplorer/issues"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["site", "docs", "examples"]

[tool.ruff.lint]
# Start conservative: pyflakes (F), pycodestyle errors (E), import sorting (I),
# pyupgrade (UP), flake8-bugbear (B). Expand over time.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length handled by the formatter
    "E731",  # `f = lambda z: ...` is idiomatic for this complex-function domain
]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export the public API surface (and use star imports);
# "unused"/star-import findings there are intentional.
"**/__init__.py" = ["F401", "F403", "F405"]
# Tests: E402 is the required `pytest.importorskip(...)`-before-imports idiom; F841
# unused locals are common, intentional test scaffolding.
"tests/**" = ["E402", "F841"]
